services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: netguard_ai
      NETGUARD_ARTIFACT_DIR: ${NETGUARD_ARTIFACT_DIR:-/ml/artifacts}
      NETGUARD_MODEL_FILENAME: ${NETGUARD_MODEL_FILENAME:-model.pkl}
      BLOCK_API_KEY: ${BLOCK_API_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      WHITELIST_IPS: 127.0.0.1,::1,mongo,api
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_BLOCK_API_KEY: ${BLOCK_API_KEY:-change-me-in-production}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
